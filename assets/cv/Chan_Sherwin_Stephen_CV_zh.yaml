cv:
  name: 陈健怡
  location: "新加坡 | 微信: chenjianyi0402"
  email: sherwin0402@gmail.com
  # phone: +65-97656780
  website: https://sherwin0402.github.io/
  social_networks:
    - network: LinkedIn
      username: sherwin-chan
    # - network: GitHub
    #   username: sherwin0402
  sections:
    概要:
      - 南洋理工大学（NTU）博士毕业年学生（预计2026年2月毕业），专注于辅助机器人的物理人机交互（pHRI）仿真。使用 MuJoCo 与 Real2Sim2Real 框架开发真实感数字人体与个性化控制器，研究安全、直观的人机交互。目前正在构建人形机器人数据工厂，用于生成可扩展、高保真的远程操作数据，以训练强大、可泛化的视觉-语言-动作（VLA）/基础模型（FM）策略。
    教育背景:
      - institution: '[南洋理工大学](https://www.ntu.edu.sg/)'
        area: '**机械工程**'
        degree: '**博士**'
        date: 2021年9月 -- 2026年2月(预计)
        start_date: 2021-09
        end_date: 2021-09 # ! Expected
        location: 新加坡
        summary:
        highlights:
          - '**导师：** 洪伟德教授 (Prof Ang Wei Tech)'
          - '**拟定论文题目：** Human-in-the-Loop Simulation for Adaptive Assistive Robots: Personalising Human Models and Robot Control'
          - '**研究方向：** 基于物理的仿真、人机交互、机器学习、基础模型，大语言模型'
      - institution: '[南洋理工大学](https://www.ntu.edu.sg/)'
        area: '**机械工程**（机器人与机电一体化方向）'
        degree: '**本科**'
        date: 2017年8月 -- 2021年5月
        start_date: 2017-08
        end_date: 2021-05
        location: 新加坡
        summary:
        highlights:
          - "**绩点:** 4.84/5.00, 学年入选院长名单 (Dean's List) 2017/2018"
          - '**奖项:** 南洋奖学金 (Nanyang Scholarship)'
    研究项目:
      - name: '人形机器人数据工厂 (Humanoid/Embodied AI Data Factory)'
        date: 2025年7月 -- 至今
        start_date: 2025-07
        end_date: present
        summary:
        highlights:
          - '主导开发下一代远程操作框架，用于全身、双臂和灵巧操作，优化以降低操作员认知负荷并保持自然人体运动。'
          - '构建可扩展的端到端数据生成管道，融合无标记动作捕捉、多传感器感知和实时重定向，支持物理类人形机器人和仿真代理。'
          - '推进方法以缩小人类演示和机器人执行之间的具身差距，实现高通量收集丰富标注的数据集，用于训练强大的基于基础模型的视觉-语言-动作（VLA）策略。'
      - name: '人机闭环仿真平台(Human-In-The-Loop Robotic Simulator)'
        date: 2021年9月 -- 至今
        start_date: 2021-09
        end_date: present
        location:
        summary:
        highlights:
          - '主导开发了一套用于辅助机器人研究的人机闭环仿真框架，具备跨能力的个性化数字孪生。该管道集成骨骼、肌肉骨骼和软体模型，使用强化学习模拟多样化能力，实现真实、自适应的机器人测试。'
          - '设计并验证了 Real2Sim2Real 框架，用于个性化调整机器人控制器，已应用于机器人辅助喂食与步态辅助机器人，通过仿真驱动的适应和现实世界测试改善人机交互。'
          - '研究了仿真中的各种人机交互模式，包括软体交互动力学、质量-弹簧-阻尼模型和其他方法，以准确表现物理交互。'
      - name: '移动式第三机械臂机器人(Mobile Third Arm Robot)'
        date: 2020年 -- 2022年
        summary:
        highlights:
          - '设计并开发了一套完整的视觉引导移动第三机械臂协作机器人，用于协助护理人员完成从床到轮椅的中度辅助枢轴转移，涵盖机械设计、电子集成与控制系统。'
          - '实现了基于计算机视觉的人体追踪算法，并开发了人机交互策略，以确保护理人员、患者和移动第三机械臂机器人之间的安全、直观操作。'
    工作经历:
      - company: 南洋理工大学
        position: 项目主管
        location: 新加坡
        date: 2021年8月 -- 至今
        start_date: 2021-08
        end_date: present
        highlights:
          - '指导7名本科毕业设计学生，并与跨学科团队（生物力学专家、治疗师、工程师、研究负责人等）合作，推进仿真器的开发与应用。'
          - '撰写金额从20万新元至超过300万新元的大型多机构研究资金提案（目前处于评审阶段），以支持正在进行及即将开展的科研项目。'
      - company: '[Oishii](https://oishii.com/)'
        position: 工程实习生
        location: 新泽西州，美国
        date: 2019年6月 -- 2020年6月
        start_date: 2019-06
        end_date: 2020-06
        highlights:
          - '设计了一套室内垂直农场结构，可容纳25万株植物，并采用创新托架系统，将建造与组装效率提升了90%。'
          - '主导开发了价值40万美元的研发设施，包含10个独立生长环境，追踪超过80项植物参数，以优化生长与产量。'
          - '作为主测试工程师，带领12人工程团队制定测试与故障排查流程，成功推动全球最大草莓室内垂直农场投入运营。'
          - '参与筛选32名工程职位候选人，并指导19位新进技术人员，提升其机械与电气技能，同时协助其融入公司工作规范。'
          
